# Self-hosted LiveKit for VisionClaw. API keys come from the LIVEKIT_KEYS env var
# (livekit.env, written by deploy.sh), never from this file.
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
